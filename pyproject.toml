[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-impedance-reproduction"
version = "0.1.0"
description = "FR3/MuJoCo reproduction of nonlinear H-infinity inverse-optimal impedance control"
requires-python = ">=3.11"
dependencies = ["mujoco==3.16.0", "numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["fr3imp*"]
